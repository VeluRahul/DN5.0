<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Portal</title>

<link rel="stylesheet" href="styles.css">

<!--
Accessibility Audit (Lighthouse)

Initial Accessibility Score: 82

Issues Found

1. Missing alt attributes
2. Missing labels for form inputs
3. Incorrect heading hierarchy
4. Interactive div elements
5. Low color contrast
6. Missing semantic HTML

After Fixes

Accessibility Score : 100
-->

</head>

<body>

<header>

<h1>Student Portal</h1>

<nav aria-label="Main navigation">

<ul>

<li>

<a href="#" aria-current="page">

Home

</a>

</li>

<li>

<a href="#courses">

Courses

</a>

</li>

<li>

<a href="#profile">

Profile

</a>

</li>

</ul>

</nav>

</header>

<main>

<section>

<img

src="images/banner.jpg"

alt="Student Portal Banner"

>

<h2>

Welcome

</h2>

<p>

Digital Nurture Frontend Development

</p>

</section>

<section id="courses">

<h2>

Available Courses

</h2>

<label for="search">

Search Courses

</label>

<input

type="text"

id="search"

placeholder="Search"

>

<div class="course-card">

<h3>

Data Structures

</h3>

<p>

Course Code : CS101

</p>

<button>

Enroll

</button>

</div>

<div class="course-card">

<h3>

Database Management

</h3>

<p>

Course Code : CS102

</p>

<button>

Enroll

</button>

</div>

</section>

<section id="profile">

<h2>

Student Profile

</h2>

<form>

<label for="name">

Name

</label>

<input

type="text"

id="name"

>

<label for="email">

Email

</label>

<input

type="email"

id="email"

>

<label for="semester">

Semester

</label>

<input

type="number"

id="semester"

>

<button type="submit">

Save

</button>

</form>

</section>

</main>

<footer>

<p>

© 2026 Student Portal

</p>

</footer>

<script src="script.js"></script>

</body>

</html>
