; ============================================================
; File : alembic.ini
;
; Purpose:
; This file stores the Alembic configuration used for
; database schema migrations.
; ============================================================

; ------------------------------------------------------------
; Task 92
; ------------------------------------------------------------
; Initialize Alembic using:
;
; alembic init migrations
;
; This command automatically creates:
;   - alembic.ini
;   - migrations/
;   - migrations/env.py
;   - migrations/versions/
; ------------------------------------------------------------


; ------------------------------------------------------------
; Task 93
; ------------------------------------------------------------
; Configure the database connection string.
;
; Example (MySQL):
;
; sqlalchemy.url = mysql+mysqlconnector://root:password@localhost/college_db_orm
;
; Example (PostgreSQL):
;
; sqlalchemy.url = postgresql+psycopg2://postgres:password@localhost/college_db_orm
; ------------------------------------------------------------


; ------------------------------------------------------------
; Task 94
; ------------------------------------------------------------
; Edit migrations/env.py
;
; Import Base from models.py
;
; from models import Base
;
; Set:
;
; target_metadata = Base.metadata
;
; This allows Alembic to detect ORM model changes.
; ------------------------------------------------------------


; ------------------------------------------------------------
; Task 95
; ------------------------------------------------------------
; Generate the initial migration.
;
; Command:
;
; alembic revision --autogenerate -m "initial schema"
;
; Alembic creates a migration file inside:
;
; migrations/versions/
; ------------------------------------------------------------


; ------------------------------------------------------------
; Task 96
; ------------------------------------------------------------
; Inspect the generated migration file.
;
; Verify that it contains:
;
; upgrade()
;
; downgrade()
;
; upgrade() applies schema changes.
;
; downgrade() reverts schema changes.
; ------------------------------------------------------------


; ------------------------------------------------------------
; Task 97
; ------------------------------------------------------------
; Apply the migration.
;
; Command:
;
; alembic upgrade head
;
; Verify migration:
;
; alembic current
;
; Verify migration history:
;
; alembic history
;
; Confirm the following tables exist:
;
; departments
; students
; courses
; enrollments
; professors
; alembic_version
; ------------------------------------------------------------
